version: 2
updates:
  # Actions are pinned to commit SHAs; Dependabot proposes updates with the new SHA and release notes.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  # Python dependencies in uv.lock; one grouped PR a month, security fixes come as separate PRs right away.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ["*"]
