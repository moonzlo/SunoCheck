name: Build

# Reusable: lint, tests, SunoCheck-Setup.exe and SunoCheck-Portable.exe as the "SunoCheck-windows" artifact.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked --group dev --group build

      - name: Lint
        run: uv run ruff check src tests tools packaging .github/scripts

      - name: Test
        run: uv run pytest -q

      - name: Build executables
        run: uv run pyinstaller packaging/sunocheck.spec --noconfirm --distpath dist --workpath build

      # Inno Setup is preinstalled on the windows-2025 runner image.
      - name: Build installer
        run: |
          $version = uv version --short
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=$version" packaging\sunocheck.iss

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SunoCheck-windows
          path: |
            dist/SunoCheck-Setup.exe
            dist/SunoCheck-Portable.exe
          if-no-files-found: error
          retention-days: 14
