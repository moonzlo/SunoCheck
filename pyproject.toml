[project]
name = "sunocheck"
version = "0.4.0"
description = "SunoCheck - AI music detection: detects Suno-generated music in system audio and optionally skips it"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "src/sunocheck/models/LICENSE-lofcz.txt"]
requires-python = ">=3.12,<3.13"
keywords = ["suno", "ai-music", "ai-detection", "audio-fingerprint", "wasapi", "yandex-music"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "soundfile>=0.12",
    "pyaudiowpatch>=0.2.12",
    "winrt-runtime>=2.0",
    "winrt-Windows.Foundation>=2.0",
    "winrt-Windows.Media.Control>=2.0",
    "soxr>=1.1.0",
    "pyqtgraph>=0.14.0",
    "pyside6-essentials>=6.12.0",
    "winrt-windows-media-devices>=3.2.1",
]

[project.urls]
Homepage = "https://github.com/moonzlo/SunoCheck"
Changelog = "https://github.com/moonzlo/SunoCheck/blob/main/CHANGELOG.md"

[project.scripts]
sunocheck = "sunocheck.cli:main"

[project.gui-scripts]
sunocheck-gui = "sunocheck.gui:main"

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"

[dependency-groups]
build = [
    "pillow>=12.3.0",
    "pyinstaller>=6.22.3",
]
dev = [
    "pyright[nodejs]>=1.1.400",
    "pytest>=8.0",
    "ruff>=0.8",
]
research = [
    "pyarrow>=26.0.0",
    "scikit-learn>=1.9.1",
]

[tool.ruff]
line-length = 140
target-version = "py312"
src = ["src"]
extend-exclude = ["research"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pyright]
include = ["src", "tests", "tools", "packaging", ".github/scripts"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
